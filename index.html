<style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px; --primary:#2C1810; --primary-light:#5B3A29; --shadow:rgba(91,58,41,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
html{scroll-behavior:smooth;}
body{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:17px;line-height:1.85;color:var(--text);background:var(--bg);
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;user-drag:none;pointer-events:none;}

/* ── 側欄 ── */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;width:0;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:6px;z-index:5;
  text-decoration:none;cursor:pointer;
  transition:color .25s;display:block;
  border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px;}
.sb-nav{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center;padding-top:4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;
  padding:6px 4px;border-radius:6px;width:64px;text-decoration:none;
  color:var(--sbText);transition:background .25s, transform .25s;}
.sb-item:hover{background:rgba(184,134,11,.12);}
.sb-circle{width:34px;height:34px;border-radius:50%;
  background:rgba(212,196,168,.15);color:var(--sbText);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-weight:600;font-size:14px;
  border:1px solid rgba(212,196,168,.25);transition:all .3s;}
.sb-label{margin-top:4px;font-family:"Noto Sans TC",sans-serif;
  font-size:11px;letter-spacing:1px;line-height:1.3;text-align:center;opacity:.85;}
.sb-item.active{background:linear-gradient(135deg,rgba(184,134,11,.3),rgba(212,168,75,.18));}
.sb-item.active .sb-circle{background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#1e1a14;border-color:var(--goldL);box-shadow:0 0 14px rgba(184,134,11,.55);}
.sb-item.active .sb-label{color:var(--goldL);opacity:1;font-weight:600;}

/* ── 漢堡 / 手機 ── */
#sbToggle{position:fixed;top:14px;left:14px;width:44px;height:44px;
  background:var(--sbBg);color:var(--gold);border:1px solid rgba(184,134,11,.4);
  border-radius:50%;font-size:20px;cursor:pointer;z-index:110;display:none;}
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.show{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;padding:0 16px;}
  .site-hero{padding:60px 16px 40px;}
  .hero-title{font-size:40px!important;}
}

/* ── 底部進度膠囊（2026/05 預設·中文+接近頁尾淡出）── */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
  transition:opacity .45s ease, transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* ── 主內容 ── */
.main{margin-left:var(--sbW);min-height:100vh;}
.site-hero{position:relative;padding:90px 40px 60px;text-align:center;
  background:var(--headGrad);color:#f5ecd8;overflow:hidden;}
.site-hero::before{content:"般若";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:280px;
  color:rgba(184,134,11,.04);font-weight:900;pointer-events:none;letter-spacing:30px;}
.hero-inner{position:relative;z-index:2;max-width:1080px;margin:0 auto;}
.hero-title{font-size:46px;font-weight:900;color:var(--goldL);letter-spacing:6px;line-height:1.2;
  text-shadow:0 2px 12px rgba(0,0,0,.45);}
.hero-title .ht-line2{display:block;font-size:34px;letter-spacing:8px;margin-top:8px;color:#f5ecd8;}
.hero-subtitle{margin-top:18px;font-size:18px;color:#f5ecd8;opacity:.85;line-height:1.85;
  font-family:"Noto Serif TC",serif;letter-spacing:1px;}
.hero-meta{margin-top:14px;font-size:14px;color:rgba(245,236,216,.7);letter-spacing:2px;}
.hero-range{margin-top:8px;font-size:14px;color:var(--goldL);letter-spacing:3px;font-weight:600;}

/* ── 編者前言 ── */
.preface{max-width:980px;margin:36px auto 18px;padding:30px 36px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 4px 18px rgba(91,58,41,.08);}
.preface-title{text-align:center;font-family:"Noto Sans TC",sans-serif;
  font-size:24px;font-weight:700;letter-spacing:6px;color:var(--accent);margin-bottom:18px;}
.preface-title::after{content:"";display:block;width:50px;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--goldL));margin:10px auto 0;}
.preface p{font-size:16px;line-height:2;color:var(--text2);margin-bottom:14px;text-align:justify;}
.preface p:last-child{margin-bottom:0;}

/* ── 總目錄 ── */
.toc-section{max-width:1100px;margin:30px auto;padding:0 28px;}
.toc-title{text-align:center;font-family:"Noto Sans TC",sans-serif;
  font-size:28px;font-weight:700;letter-spacing:10px;color:var(--accent);margin-bottom:8px;}
.toc-desc{text-align:center;font-size:15px;color:var(--text-muted);
  letter-spacing:3px;margin-bottom:24px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.toc-card{display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;text-decoration:none;color:var(--text);
  transition:all .25s ease;box-shadow:0 1px 3px var(--shadow);}
.toc-card:hover{transform:translateY(-2px);border-color:var(--gold);
  box-shadow:0 4px 14px rgba(184,134,11,.18);}
.toc-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:16px;font-weight:600;letter-spacing:1px;}
.toc-name{font-size:16px;line-height:1.5;color:var(--text);font-weight:500;}

/* ── 章節 ── */
.chapter{padding:24px 0;}
.ch-head{background:var(--headGrad);color:#f5ecd8;
  padding:50px 30px;text-align:center;position:relative;}
.ch-head::after{content:"";display:block;width:80px;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0;}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:4px;
  color:var(--goldL);opacity:.85;}
.ch-name{font-size:32px;font-weight:900;margin-top:6px;letter-spacing:6px;color:var(--goldL);}
.ch-sub{margin-top:10px;font-size:15px;letter-spacing:2px;opacity:.82;line-height:1.7;}

.ch-body{max-width:980px;margin:30px auto 12px;padding:0 24px;}

/* ── 橋接 ── */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;
  background:var(--gold);color:#fff;
  padding:3px 12px;border-radius:12px;
  letter-spacing:2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2;font-size:15.5px;}

/* ── iframe ── */
.ch-frame{display:block;width:100%;border:0;
  background:#fffdf7;border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}

/* ── next link ── */
.next-link{display:inline-block;margin-top:16px;
  padding:10px 22px;border:1px solid var(--gold);border-radius:24px;
  color:var(--accent);text-decoration:none;font-size:15px;letter-spacing:2px;
  background:#fffdf5;transition:all .25s;}
.next-link:hover{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;
  border-color:transparent;box-shadow:0 4px 14px rgba(184,134,11,.35);}

/* ── footer ── */
.site-footer{background:var(--sbBg);color:var(--sbText);
  text-align:center;padding:38px 24px 50px;margin-top:60px;}
.site-footer p{margin:6px 0;letter-spacing:4px;font-size:15px;color:var(--goldL);}
.site-footer p.f-sub{font-size:13px;color:rgba(212,196,168,.7);letter-spacing:2px;margin-top:14px;}

#backTop{position:fixed;right:22px;bottom:78px;width:44px;height:44px;
  background:var(--sbBg);color:var(--gold);border:1px solid rgba(184,134,11,.4);
  border-radius:50%;font-size:18px;cursor:pointer;z-index:115;display:none;
  align-items:center;justify-content:center;transition:all .25s;}
#backTop.show{display:flex;}
#backTop:hover{background:var(--gold);color:#fff;}

@media(max-width:600px){
  body{font-size:15.5px;}
  .hero-title{font-size:34px!important;}
  .hero-title .ht-line2{font-size:24px!important;}
  .ch-name{font-size:24px!important;letter-spacing:3px;}
}

/* ============ 1.2x 字級放大 ============ */
body{font-size:20px!important;}
.hero-title,.site-hero h1{font-size:56px!important;}
.hero-title .ht-line2{font-size:42px!important;}
.hero-subtitle,.site-hero .hero-subtitle{font-size:20px!important;}
.hero-sub,.site-hero .hero-sub,.hero-meta{font-size:18px!important;}
.hero-range{font-size:17px!important;}
.preface p,.preface-text p{font-size:19px!important;line-height:2.1!important;}
.preface h2,.preface-title{font-size:30px!important;}
.toc-title{font-size:34px!important;}
.toc-desc{font-size:17px!important;}
.toc-name{font-size:19.5px!important;line-height:1.7!important;}
.toc-num{font-size:17px!important;}
.bridge p{font-size:18.5px!important;line-height:2.1!important;}
.bridge-label{font-size:12.5px!important;letter-spacing:2.2px!important;}
.ch-num{font-size:18px!important;}
.ch-name{font-size:34px!important;}
.ch-sub,.ch-desc,.ch-subtitle{font-size:17px!important;}
.next-link{font-size:17px!important;}
.read-progress{font-size:14px!important;padding:9px 24px!important;}
.read-progress .rp-bar{width:148px!important;height:4px!important;}
.read-progress .rp-pct{font-size:13px!important;}
.read-progress .rp-label{font-size:13px!important;}
.sb-circle{font-size:15px!important;}
.sb-label{font-size:11.5px!important;}
.site-footer,.site-footer p{font-size:15px!important;}
</style>

<script>
// ── 進度條 + 接近頁尾淡出 ──
var rpFill=document.getElementById('rpFill');
var rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill) rpFill.style.width=pct+'%';
  if(rpPct) rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();
(function(){
  var cap=document.getElementById('readProgress');
  if(!cap) return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var targets=[];
  var f1=document.querySelector('[data-wy-notice="v2"]');
  if(f1) targets.push(f1);
  var f2=document.querySelector('.site-footer');
  if(f2) targets.push(f2);
  if(!targets.length) return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      var any=entries.some(function(e){return e.isIntersecting;});
      setHide(any);
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  } else {
    var check=function(){
      var dh=document.documentElement.scrollHeight;
      var sb=window.scrollY+window.innerHeight;
      setHide(dh-sb<240);
    };
    window.addEventListener('scroll',check,{passive:true});
    check();
  }
})();

// ── iframe 自動高度（body.scrollHeight 法）──
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body) return;
    d.body.style.minHeight='0';
    d.body.style.height='auto';
    if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
    var h=d.body.scrollHeight;
    if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){tries++;resizeFrame(f);if(tries<30) setTimeout(tick,200);}
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});
document.addEventListener('click',function(e){
  var a=e.target;
  while(a&&a.tagName!=='A') a=a.parentElement;
  if(!a) return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2) return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50) clearInterval(_riv);},300);

// ── 側欄高亮 ──
var sbItems=document.querySelectorAll('.sb-item');
function updateActive(){
  var chs=document.querySelectorAll('.chapter');
  var idx=-1;
  var th=window.innerHeight*0.35;
  chs.forEach(function(ch,i){
    var t=ch.getBoundingClientRect().top;
    if(t<th) idx=i;
  });
  sbItems.forEach(function(it,i){
    it.classList.toggle('active',i===idx);
  });
}
window.addEventListener('scroll',updateActive,{passive:true});
updateActive();

// ── backTop ──
var bt=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  bt.classList.toggle('show',window.scrollY>600);
},{passive:true});
bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

// ── sb-brand 平滑回頂 ──
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

// ── 漢堡 ──
var sbT=document.getElementById('sbToggle');
var sb=document.getElementById('sb');
sbT.addEventListener('click',function(){sb.classList.toggle('show');});

// ── 防複製 ──
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('mousedown',function(e){
    if(e.button===2) blk(e);
  },true);
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12') blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
  setInterval(function(){
    if(window.getSelection) try{window.getSelection().removeAllRanges();}catch(e){}
  },300);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-52-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
