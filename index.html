.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 80%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;color:var(--gold);}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:3px;color:var(--gold);}
.sb-nav{display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;margin-top:4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;width:100%;cursor:pointer;transition:background .2s;border-radius:6px;}
.sb-item:hover{background:rgba(184,134,11,.14);}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;color:var(--goldL);}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;letter-spacing:.3px;color:var(--sbText);opacity:.86;text-align:center;line-height:1.25;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;box-shadow:0 0 12px rgba(184,134,11,.6);}
.sb-item.active .sb-label{color:var(--goldL);opacity:1;}

.main{margin-left:var(--sbW);}

.site-hero::before{content:"般若";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:230px;font-weight:900;color:rgba(212,168,75,.04);white-space:nowrap;pointer-events:none;}
.hero-inner{position:relative;z-index:2;max-width:900px;margin:0 auto;}
.hero-title{font-size:56px;font-weight:900;color:var(--goldL);margin:0 0 18px;letter-spacing:3px;}
.hero-subtitle{font-size:20px;color:#e8dcc0;margin:0 0 22px;line-height:1.7;}
.hero-meta{font-size:18px;color:#c9b78d;letter-spacing:1px;margin-bottom:14px;}
.hero-divider{width:80px;height:2px;background:var(--gold);margin:18px auto;}
.hero-range{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:16px;color:#1e1a14;background:var(--goldL);padding:7px 20px;border-radius:20px;letter-spacing:1px;}

.preface{max-width:880px;margin:46px auto 8px;padding:0 28px;}
.preface-title{text-align:center;font-size:30px;color:var(--accent);margin:0 0 8px;font-weight:700;}
.preface-rule{width:64px;height:2px;background:var(--gold);margin:0 auto 24px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 16px;text-align:justify;}

.ch-frame{display:block;width:100%;border:0;background:#fffdf7;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}

.next-link:hover{color:var(--gold);}

.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}

<script id="wy-decoder">
(function(){

  var KEY = "wy-dazhidulun-52-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }

      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
